name: gemini-chatbot-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_password}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gemini-chatbot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit_password}@postgres:5432/${POSTGRES_DB:-orbit_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_ORCHESTRATOR_KEY=${GEMINI_ORCHESTRATOR_KEY:-}
      - GEMINI_WORKER_KEY=${GEMINI_WORKER_KEY:-}
      - ALLOWED_ORIGINS=["http://localhost:8081","http://127.0.0.1:8081","http://localhost","http://127.0.0.1","http://localhost:5173","http://127.0.0.1:5173"]
      - COOKIE_SECURE=false
      - SESSION_DAYS=7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - gemini-chatbot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbit-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - gemini-chatbot-net

volumes:
  postgres_data:
    driver: local

networks:
  gemini-chatbot-net:
    driver: bridge
